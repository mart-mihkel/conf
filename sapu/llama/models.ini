version = 1

[*]
n-gpu-layers = all
flash-attn = on
jinja = true
cache-type-k = q8_0
cache-type-v = q8_0

[deepseek-v4-flash]
model = ./models/DeepSeek-V4-Flash-0731-UD-Q4_K_XL-00001-of-00005.gguf
ctx-size = 131072
parallel = 1
batch-size = 4096
ubatch-size = 512
model-draft = ./models/dspark-DeepSeek-V4-Flash-0731-Q8_0.gguf
spec-type = draft-dspark
spec-draft-n-max = 7
spec-draft-sampling = greedy

[qwen3.8-27b]
model = ./models/Qwen3.8-27B-UD-Q8_K_XL.gguf
ctx-size = 262144
parallel = 1
batch-size = 4096
ubatch-size = 512
